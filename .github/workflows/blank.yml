
name: Build TalkingMobs

on:
  workflow_dispatch:
  push:
    paths:
      - '**TalkingMobs.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extrair projeto
        shell: bash
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -name '*TalkingMobs.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP encontrado na raiz."
            exit 1
          fi

          unzip -q "$ZIP" -d source

      - name: Compilar mod
        shell: bash
        run: |
          WRAPPER=$(find source -name gradlew -type f | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "Gradle Wrapper nao encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Salvar arquivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: TalkingMobs-build
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          
